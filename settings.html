<div class="wrap" style="max-width:520px">
<h2 style="margin-bottom:16px">Settings</h2>
<div class="box">
<h4 style="margin-bottom:6px">Profile</h4>
<div class="av setav" id="pav">Q</div>
<label>Profile photo (max 2 MB)</label>
<input type="file" id="pfile" accept="image/*">
<label>Naam</label>
<input type="text" id="pname" maxlength="60">
<button class="btn" id="psave" type="button">Save Profile</button>
<div class="msg" id="pmsg"></div>
</div>
<div class="box">
<h4 style="margin-bottom:6px">Password change</h4>
<label>Naya password</label>
<input type="password" id="np" autocomplete="new-password">
<label>Naya password dobara</label>
<input type="password" id="np2" autocomplete="new-password">
<button class="btn" id="psave2" type="button">Change Password</button>
<div class="msg" id="pmsg2"></div>
</div>
</div>
