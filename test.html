<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Test | Quantify</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="test.css">
<script src="theme.js"></script></head>
<body class="tbody">
<header class="th">
  <button class="ic pbtn" id="pause" title="Pause">❚❚</button>
  <div class="tt"><div id="timer">--:--:--</div><div class="sub" id="ttl">Loading...</div></div>
  <button class="ic" id="lang" style="display:none" title="Language"><b>E</b>|<b>अ</b></button>
  <button class="theme-btn ic" type="button">🌙</button>
  <button class="ic" id="menu" title="Question palette">☰</button>
</header>

<div class="tlayout">
  <main class="tmain">
    <div class="qhead">
      <span class="qn" id="qno">1</span><span class="qtm" id="qtime">00:00</span>
      <span class="mks" id="mks"></span><span class="sp"></span>
      <button class="star" id="star" title="Bookmark">☆</button>
    </div>
    <div class="qtext" id="qtext"></div>
    <div id="opts"></div>
  </main>

  <aside class="pal" id="pal">
    <div class="phead"><b>Question Palette</b><button class="ic cl" id="pclose">✕</button></div>
    <div class="leg" id="leg"></div>
    <div class="pgrid" id="pgrid"></div>
    <button class="btn-s sub-btn" id="submit">Submit Test</button>
  </aside>
</div>
<div class="bd" id="bd"></div>

<footer class="tf">
  <button class="fb" id="mark">Mark &amp; Next</button>
  <button class="fb" id="clear">Clear Response</button>
  <button class="fb pr" id="next">Save &amp; Next</button>
</footer>

<div class="ov" id="pov"><div class="ovb"><h2>Test Paused ⏸</h2><p>Timer ruka hua hai.</p><p class="big" id="ptime"></p><button class="btn-s" id="resume">▶ Resume</button></div></div>
<div class="ov" id="cov"><div class="ovb"><h3>Test submit karein?</h3><div class="sum" id="sum"></div>
<div class="row" style="justify-content:center;gap:10px"><button class="btn-s ghost" id="cno">Wapas</button><button class="btn-s" id="cyes">Haan, Submit</button></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script><script src="test.js"></script>
</body></html>
